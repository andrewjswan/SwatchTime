name: SwatchTime / Validate

on:
  push:
  pull_request:

jobs:
  changes:
    name: 👀 Source / Changed
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      python: ${{ steps.changes.outputs.python }}
      yaml: ${{ steps.changes.outputs.yaml }}
    steps:
      - name: ⬇️ Check out Repo
        uses: actions/checkout@v7

      - name: ⚙️ Check for changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            src:
              - 'custom_components/**'

  ha:
    name: 👻 HA Validation (hassfest)
    if: ${{ needs.changes.outputs.src == 'true' }}
    needs:
      - changes
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out Repo
        uses: "actions/checkout@v7"
      - name: 🚀 Run HassFest
        uses: "home-assistant/actions/hassfest@master"

  hacs:
    name: 🏠 HACS Validation
    if: ${{ needs.changes.outputs.src == 'true' }}
    needs:
      - changes
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out Repo
        uses: "actions/checkout@v7"
      - name: 🚀 Run HACS Validation
        uses: "hacs/action@main"
        with: {category: "integration"}

  validate:
    name: 👻 Validation
    uses: "andrewjswan/actions/.github/workflows/validate.yml@main"

  mypy:
    name: 🐍 Type Check
    if: ${{ needs.changes.outputs.src == 'true' }}
    needs:
      - changes
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out Repo
        uses: "actions/checkout@v7"

      - name: 🐍 Set up Python
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"

      - name: 🛠️ Install mypy and dependencies
        run: |
          pip install mypy homeassistant

      - name: 🚀 Run mypy strict check
        run: |
          mypy --strict --config-file .pyproject.toml custom_components/swatch_time

  ci-status:
    name: 🎭 Status
    runs-on: ubuntu-latest
    needs:
      - ha
      - hacs
      - validate
      - mypy
    if: always()
    steps:
      - name: 🎉 Success
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: ❌ Failure
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
